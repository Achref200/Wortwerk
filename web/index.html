<!DOCTYPE html>
<html lang="de">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>Wortwerk — Deutsch lernen, jeden Tag</title>
  <meta name="description" content="Wortwerk: gesundes tägliches Deutschlernen mit kurzen Lektionen, Wiederholungen und Fritz als Lernbegleiter.">

  <!-- Installable web app -->
  <meta name="application-name" content="Wortwerk">
  <meta name="theme-color" content="#F4F1EA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wortwerk">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png">

  <style>
    :root { color-scheme: light; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #E5E1D6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    body { display: flex; align-items: center; justify-content: center; }

    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      background: #F4F1EA;
      overflow: hidden;
    }
    @supports not (height: 100dvh) { #app { height: 100vh; } }
    @media (min-width: 820px) and (min-height: 640px) {
      #app {
        width: 430px;
        height: min(920px, 94dvh);
        border-radius: 32px;
        box-shadow: 0 32px 80px rgba(30, 29, 34, .22), 0 0 0 1px rgba(30, 29, 34, .07);
      }
    }

    #flutter_target { width: 100%; height: 100%; }

    #splash {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #F4F1EA;
      transition: opacity 260ms ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; border-radius: 24px; }
    #splash .name {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1E1D22;
    }
    #splash .tagline { font-size: 13px; color: #55525C; }
    #splash .spinner {
      width: 22px;
      height: 22px;
      margin-top: 8px;
      border-radius: 50%;
      border: 2px solid #DDD8CC;
      border-top-color: #E8590C;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    noscript { display: block; padding: 24px; text-align: center; color: #1E1D22; }
  </style>
</head>
<body>
  <div id="app">
    <div id="splash" aria-hidden="true">
      <img src="icons/Icon-192.png" alt="Wortwerk">
      <div class="name">Wortwerk</div>
      <div class="tagline">Deutsch lernen, jeden Tag.</div>
      <div class="spinner"></div>
    </div>
    <div id="flutter_target"></div>
    <noscript>Bitte JavaScript aktivieren, um Wortwerk zu öffnen.</noscript>
  </div>

  <script>
    function hideSplash() {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 420);
    }
    setTimeout(hideSplash, 15000); // safety net
  </script>
  <script>
    // Installable PWA: a small service worker keeps the shell available offline
    // and lets browsers offer "Install app" / "Add to Home Screen".
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function (error) {
          console.warn('Service worker registration failed:', error);
        });
      });
    }
  </script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        try {
          // Host Flutter inside #flutter_target so the app keeps phone-shaped
          // proportions on desktop instead of stretching to the window.
          var appRunner = await engineInitializer.initializeEngine({
            hostElement: document.getElementById('flutter_target')
          });
          await appRunner.runApp();
        } finally {
          hideSplash();
        }
      }
    });
  </script>
</body>
</html>
